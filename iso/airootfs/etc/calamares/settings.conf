---
modules-search: [ local ]

instances:
  - id: lateclone
    module: shellprocess
    config: shellprocess-lateclone.conf
  - id: latedesktop
    module: shellprocess
    config: shellprocess-latedesktop.conf
  - id: lateprovision
    module: shellprocess
    config: shellprocess-lateprovision.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - modernnet
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - bootloader
  - packages
  - shellprocess@lateclone
  - shellprocess@latedesktop
  - shellprocess@lateprovision
  - umount
- show:
  - finished

branding: modern
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
