---
# systemd-boot on the ESP at /boot (partition.conf efiSystemPartition).
# Current Calamares finds kernels under kernelSearchPath; the old
# kernel:/img:/fallback: keys are ignored and left the job to throw.
efiBootLoader: "systemd-boot"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
kernelParams:
  - "quiet"
  - "splash"
  - "loglevel=3"
  - "systemd.show_status=auto"
  - "rd.udev.log_priority=3"
  - "vt.global_cursor_default=0"
loaderEntries:
  - "timeout 3"
  - "console-mode keep"
installEFIFallback: true
efiBootloaderId: "ModernOS"
efiBootMgr: "efibootmgr"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
