---
# Must stay ahead of bootloader: that step's kernel-install runs mkinitcpio,
# and until this removes /etc/mkinitcpio.conf.d/archiso.conf the initramfs
# is built with the archiso hook and the installed disk cannot boot.
dontChroot: false
timeout: 60
verbose: false
i18n:
    name: "Preparing the system for first boot"
script:
    - command: "/usr/lib/modern/calamares-late.sh strip"
      timeout: 60
      verbose: false
