---
# First long exec job: unsquash the live image onto the target. QEMU can
# sit here for many minutes; Calamares only moves the bar when unsquashfs
# reports. Later jobs are named shellprocess instances.
unpack:
  - source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
