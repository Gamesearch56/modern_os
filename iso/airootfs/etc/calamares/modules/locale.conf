---
# Desktop UI is English and German only (docs/I18N.md). The locale
# picker still reads /usr/share/i18n/SUPPORTED first; live-setup.sh
# replaces that file on the live overlay so this path is the fallback.
localeGenPath: "/etc/locale.gen"
region: "Europe"
zone: "Berlin"
useSystemTimezone: true
adjustLiveTimezone: false
geoip:
    style: "none"
