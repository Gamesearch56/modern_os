---
# Arch stores converted keymaps here, not /lib/kbd. Layouts themselves
# are filtered to installer-locales.json `layouts` in live-xkb-filter.py
# (same catalog as Settings → Keyboard). Live apply is setxkbmap on
# Xwayland (package xorg-setxkbmap). locale1 would not change that X
# server. The AUR patch makes Config::apply() run on a layout change
# even when live-xkb-filter.py left no variants — upstream only starts
# that timer from the variant signal. ASCII layouts also pass -option
# so cage/Xwayland rebuilds; -layout de alone is ignored on first pick.
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/usr/share/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: false
useLocale1: false
# Always start on English. With guessing on, picking German on Welcome or
# Location flipped this page to German behind the user's back. Off, the
# initial pick comes from `setxkbmap -print` (a fresh Xwayland reports
# `pc+us`). Do not rely on model order if that print fails — the list is
# sorted by description, so Arabic would sort first. Selecting another
# layout here still reaches the installed system; see provision-iso.sh.
guessLayout: false
configure:
    kwin: false
    gnome: false
