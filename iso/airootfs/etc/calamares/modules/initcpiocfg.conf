---
# Writes HOOKS for the installed root. Without this the target keeps the
# live /etc/mkinitcpio.conf that unpackfs copied, and nothing tailors it to
# the partitioning the user actually chose.
#
# There is deliberately no `initcpio` step after this one: bootloader.conf
# uses systemd-boot, so Calamares builds the initramfs through
# kernel-install (etc/kernel/install.conf pins layout=bls and
# initrd_generator=mkinitcpio), which reads this file. The image that
# survives the next kernel package is /boot/vmlinuz-linux-zen, and only
# if the preset's ALL_kver names it — otherwise mkinitcpio skips the
# build and the old kernel boots with its modules already deleted.
#
# useSystemdHook stays false so a failed boot still reaches the busybox
# emergency shell.
useSystemdHook: false
