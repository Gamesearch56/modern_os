---
extraMounts:
  - device: "tmpfs"
    fs: "tmpfs"
    mountPoint: "/tmp"
    options: ["defaults", "noatime"]
mountExtra: []
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache/pacman/pkg
    subvolume: /@pkg
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /swap
    subvolume: /@swap
