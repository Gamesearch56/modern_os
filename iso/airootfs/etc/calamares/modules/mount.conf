---
# Extra filesystems to mount. Swap-file subvolume is added by Calamares
# (btrfsSwapSubvol) — do not list /swap here or btrfs subvolume create
# runs twice and mount/main.py raises.
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /tmp
    options: [ defaults, noatime ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache/pacman/pkg
    subvolume: /@pkg
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /.snapshots
    subvolume: /@snapshots

btrfsSwapSubvol: /@swap

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, compress=zstd:1 ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
