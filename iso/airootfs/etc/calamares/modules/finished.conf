---
# Without a restart mode the finished page's restart control is inert
# (Config forces restartNowWanted false when the mode is "never"), so the
# button would render and do nothing. The page's own Restart button is the
# only way out: calamares-limit-languages.py hides the footer Back/Next/Done
# on the last step. It sets restartNowWanted and quits; Calamares runs
# restartNowCommand from aboutToQuit.
restartNowMode: user-unchecked
# The flag tells the live session not to start Calamares again. Cancel
# leaves the flag unset, so the installer comes back. Restart reboots.
restartNowCommand: "touch /run/modern-install-finished && systemctl -i reboot"
notifyOnFinished: false
