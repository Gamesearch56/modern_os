---
# Welcome UI languages are limited to en/de when Calamares is built
# (iso/releng/calamares-limit-languages.py). URLs come from branding.desc.
# Donate opens this desktop's Ko-fi page (branding.desc donateUrl).
# Calamares' own default is the KDE donation page, so that URL stays set here.
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: true

requirements:
    # Empty target disks have no partitions, so a welcome-page storage
    # check reports 0 GiB even when partition.conf will wipe 64 GiB.
    # requiredSpaceGiB on the partition module is the real gate.
    requiredRam: 1.0
    internetCheckUrl: https://github.com
    check:
        - ram
        - root
    required:
        - ram
        - root

geoip:
    style: "none"
