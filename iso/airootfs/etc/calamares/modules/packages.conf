---
# unpackfs already copied the live squashfs (base, linux-zen, …).
# Do not pacman -S those names here: the target has no sync db until
# late desktop runs pacman -Sy, and a -Sy plus kernel download is what
# froze the exec bar in QEMU. install.sh --needed fills any gaps.
backend: pacman
update_db: false
update_system: false
operations: []
