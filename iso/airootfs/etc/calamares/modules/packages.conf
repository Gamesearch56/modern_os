---
# Live ISO already ships these (packages.x86_64 + releng). unpackfs copies
# them onto the target. Do not update_db here: pacman -Sy plus a linux-zen
# download is what left the exec bar still for tens of minutes in QEMU.
backend: pacman
update_db: false
update_system: false
num_retries: 1
packages:
  - base
  - linux-zen
  - linux-zen-headers
  - linux-firmware
  - btrfs-progs
  - networkmanager
  - sudo
  - git
  - base-devel
