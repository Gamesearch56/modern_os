---
defaultGroups:
  - wheel
  - video
  - input
  - audio
  - render
  - seat
autologinGroup: autologin
doAutologin: false
displayAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 1
userShell: /bin/bash
allowWeakPasswords: false
allowWeakPasswordsDefault: true
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${login}"
    forbidden_names: [ localhost ]
