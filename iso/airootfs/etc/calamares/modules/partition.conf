---
efiSystemPartition: "/boot"
efiSystemPartitionSize: 1024MiB
efiSystemPartitionName: "EFI"
userSwapChoices:
  - none
  - file
  - small
  - suspend
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs"]
alwaysShowPartitionLabels: true
allowManualPartitioning: false
drawNestedPartitions: true
essentialMounts: []
initialPartitioningChoice: erase
initialSwapChoice: file
# No defaultPartitionTableType: Calamares then picks gpt on UEFI and msdos
# on BIOS. GPT on BIOS needs a bios_grub partition the erase layout lacks,
# so grub-install would fail on older laptops.
requiredSpaceGiB: 16
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache/pacman/pkg
    subvolume: /@pkg
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /.snapshots
    subvolume: /@snapshots
