# Live ISO only — autologin liveuser into cage + Calamares.
# Installed systems use install/system/greetd/ (greeter kiosk), never this file.
[terminal]
vt = 1

[default_session]
command = "/usr/lib/modern/live-session.sh"
user = "liveuser"

[initial_session]
command = "/usr/lib/modern/live-session.sh"
user = "liveuser"
