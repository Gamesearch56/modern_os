# GATED — copied to /etc/systemd/zram-generator.conf by provision-iso.sh.
# zram-generator is in 00-base, and it does nothing until this file exists.
# Half of RAM, capped at 4 GiB: a 4 GB laptop gets 2 GB of compressed swap,
# an 8 GB laptop gets 4 GB. The cap keeps a larger machine from building
# a huge zram device. Priority 100 beats the btrfs swap subvolume, so
# pressure hits compressed RAM before the disk.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
