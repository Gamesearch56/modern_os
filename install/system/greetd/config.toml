# Copied by install/lib/greetd.sh (install.sh and provision-iso.sh).
[terminal]
vt = 1

[default_session]
# kiosk.sh re-exports GREETD_SOCK, then execs start-hyprland. The `--` is
# load-bearing: start-hyprland only understands --path/--no-nixgl/--force-nixgl
# itself and forwards nothing else unless it comes after --. Without it
# Hyprland starts with no config, falls back to $HOME/.config/hypr/hyprland.lua,
# finds nothing, and autogenerates a stock session — no greeter.
command = "/etc/greetd/kiosk.sh"
user = "greeter"
