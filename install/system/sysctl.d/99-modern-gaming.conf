# GATED — not applied by install.sh.
# Copy to /etc/sysctl.d/99-modern-gaming.conf and run `sudo sysctl --system`
# only after reading docs/GAMING.md and docs/ISOLATION.md.
#
# vm.max_map_count: some Proton/Wine titles (and ElasticSearch-class
# runtimes) need a higher mapping ceiling than the kernel default.
# kernel.split_lock_mitigate: the default mitigation can tank frame
# time on some games; 0 restores the older behaviour. Measure before
# leaving this on a latency-sensitive machine.

vm.max_map_count = 1048576
kernel.split_lock_mitigate = 0
