# GATED — copied to /etc/sysctl.d/99-modern-zram.conf by provision-iso.sh.
# Takes effect on the next boot. Do not sysctl --system from provision:
# that would change the machine running the installer.
#
# 180 is the zram-generator recommendation: the kernel should compress a
# cold page into zram before it writes that page to disk. 60 (the kernel
# default) waits until the machine is already in trouble, which is when
# a hard disk freezes the desktop. page-cluster 0 matches zram, which is
# not a spinning disk. The watermark pair starts reclaim a little earlier
# so that compression is spread out instead of one stall.

vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
