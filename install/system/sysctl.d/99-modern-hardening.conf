# Installed by provision-iso.sh on a fresh install. Not applied by
# install.sh (docs/ISOLATION.md).
#
# kernel.kptr_restrict: kernel addresses in /proc/kallsyms and friends
# are hidden from unprivileged users, so a local exploit cannot read
# them to defeat KASLR. root (and perf run as root) still sees them.

kernel.kptr_restrict = 1
