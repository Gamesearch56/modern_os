# Applied by install/lib/greetd.sh. See docs/ISOLATION.md.
# Apply: install.sh on a real user home, or provision-iso.sh.
# Requires a `modern` group (created with the greeter).
# Rollback: sudo rm /etc/tmpfiles.d/modern-session.conf
d /var/lib/modern 0755 root root -
d /var/lib/modern/session 2775 root modern -
d /var/lib/modern/session/wallpapers 2775 root modern -
d /var/lib/modern/session/faces 2775 root modern -
