# ISO for a GitHub Release. Runs on Actions. Never on pull_request.
# Local builds: sudo ./scripts/iso-build.sh --mkarchiso (iso/out/ only).
name: ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  iso:
    if: >-
      github.repository == 'Gamesearch56/modern_dotfile'
      && !github.event.repository.fork
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'release' && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    container:
      image: archlinux:latest
      options: --privileged
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require vX.Y.Z
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ISO pin must be vX.Y.Z (got $TAG)" >&2; exit 1 ;;
          esac

      # Before checkout, on purpose: archlinux:latest ships no git, and
      # without one actions/checkout downloads a REST tarball that has no
      # .git at all. iso-build.sh bundles the pin with `git clone $ROOT`,
      # so that tarball fails with "repository does not exist".
      - name: git for checkout
        run: pacman -Sy --noconfirm --needed git

      # Scripts come from main so a later ISO-script fix can rebuild an
      # older pin. --tag still writes iso-pin / Settings Update target.
      # fetch-depth 0 because the bundle clone resolves $TAG locally and
      # a shallow checkout of main carries no tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: mkarchiso
        env:
          ISO_OUT: ${{ github.workspace }}/iso-out
        run: |
          pacman -Syu --noconfirm --needed archiso base-devel git python jq sudo \
            qemu-system-x86 edk2-ovmf qt6-tools
          # actions/checkout marks the workspace safe in a *temporary*
          # global config that is gone by this step, and a container job
          # runs as root over a workspace root does not own — so git here
          # rejects the repository the bundle clone reads from.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$ISO_OUT"
          df -h "$ISO_OUT" /tmp || true
          ./scripts/iso-build.sh --mkarchiso --out "$ISO_OUT" --tag "$TAG"
          find "$ISO_OUT" -name '*.iso' -ls
          MODERN_ISO_OUT="$ISO_OUT" MODERN_ISO_QEMU_MEM=4G MODERN_ISO_QEMU_SMP=2 \
            ./scripts/test-iso-qemu-smoke.sh

      - uses: actions/upload-artifact@v7
        with:
          name: modernos-iso
          path: ${{ github.workspace }}/iso-out/*.iso
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: iso
    if: >-
      github.repository == 'Gamesearch56/modern_dotfile'
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: modernos-iso
          path: iso-out
      - name: Attach ISO to Release
        run: |
          shopt -s nullglob
          files=(iso-out/*.iso)
          [ ${#files[@]} -gt 0 ] || { echo "no ISO artifact" >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
