# Friend ISO for a GitHub Release. Runs on Actions, never on the
# development PC (iso-build.sh refuses --mkarchiso when
# /home/bastianweigand exists).
name: ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  iso:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:latest
      options: --privileged
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require vX.Y.Z
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ISO pin must be vX.Y.Z (got $TAG)" >&2; exit 1 ;;
          esac
          test ! -d /home/bastianweigand

      # Scripts come from main so a later ISO-script fix can rebuild an
      # older pin. --tag still writes iso-pin / Settings Update target.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: mkarchiso
        env:
          ISO_OUT: ${{ github.workspace }}/iso-out
        run: |
          pacman -Syu --noconfirm --needed archiso base-devel git python jq sudo
          mkdir -p "$ISO_OUT"
          df -h "$ISO_OUT" /tmp || true
          ./scripts/iso-build.sh --mkarchiso --out "$ISO_OUT" --tag "$TAG"
          find "$ISO_OUT" -name '*.iso' -ls

      - uses: actions/upload-artifact@v6
        with:
          name: modernos-iso
          path: ${{ github.workspace }}/iso-out/*.iso
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: iso
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: modernos-iso
          path: iso-out
      - name: Attach ISO to Release
        run: |
          shopt -s nullglob
          files=(iso-out/*.iso)
          [ ${#files[@]} -gt 0 ] || { echo "no ISO artifact" >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
