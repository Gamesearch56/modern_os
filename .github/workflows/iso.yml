# ISO for a GitHub Release. Runs on Actions. Never on pull_request.
# Local builds: sudo ./scripts/iso-build.sh --mkarchiso (iso/out/ only).
name: ISO

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  iso:
    if: >-
      github.repository == 'Gamesearch56/modern_dotfile'
      && !github.event.repository.fork
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'release' && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    # Deliberately not a `container:` job. mkarchiso needs well over the
    # 14G GitHub guarantees free, and the preinstalled toolchains worth
    # deleting are on the host, invisible from inside a container. So the
    # build runs through `docker run` from a host step instead.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require vX.Y.Z
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ISO pin must be vX.Y.Z (got $TAG)" >&2; exit 1 ;;
          esac

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby
          sudo docker image prune -af
          df -h /

      # Scripts come from main so a later ISO-script fix can rebuild an
      # older pin. --tag still writes iso-pin / Settings Update target.
      # fetch-depth 0 because the bundle clone resolves $TAG locally and
      # a shallow checkout of main carries no tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Cache AUR packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/iso-out/aur-cache
          key: iso-aur-${{ hashFiles('iso/releng/packages.aur.x86_64', 'iso/releng/calamares-limit-languages.py', 'iso/releng/installer-locales.json') }}
          restore-keys: |
            iso-aur-

      - name: mkarchiso
        env:
          ISO_OUT: ${{ github.workspace }}/iso-out
        run: |
          mkdir -p "$ISO_OUT"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE -e ISO_OUT -e TAG \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:latest ./scripts/ci-iso-container.sh

      # Straight onto the Release, not through an artifact: one 1.8 GB ISO
      # held for a week is past the free plan's artifact storage quota.
      - name: Attach ISO to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/iso-out/*.iso)
          [ ${#files[@]} -gt 0 ] || { echo "no ISO built" >&2; exit 1; }
          for f in "${files[@]}"; do
            size="$(stat -c %s "$f")"
            # GitHub rejects Release assets of 2 GiB or more.
            [ "$size" -lt 2147483648 ] || { echo "$f is $size bytes, over the 2 GiB asset limit" >&2; exit 1; }
          done
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
