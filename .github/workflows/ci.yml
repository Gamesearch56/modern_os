name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    tags: ["v*"]
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq python3 shellcheck git
      - name: Layer lint, shellcheck, and tests
        run: scripts/ci-check.sh

  install-dry:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Pacman + builder user
        run: |
          pacman -Syu --noconfirm --needed git jq sudo
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: install.sh dry-run
        run: |
          sudo -u builder ./install/install.sh --dry-run --profile m0 \
            --target /tmp/modern-dry
        # check-isolation.sh is local only — do not run it here.
