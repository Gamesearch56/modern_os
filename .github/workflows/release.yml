# Keep a Changelog (keepachangelog.com) on every vX.Y.Z tag.
# Then dispatch ISO — GITHUB_TOKEN does not chain release: published.
name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  actions: write

jobs:
  notes:
    if: github.repository == 'Gamesearch56/modern_dotfile' && !github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish patch notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "skip $tag" >&2; exit 0 ;;
          esac
          notes="$(mktemp)"
          ./scripts/release-notes.sh "$tag" >"$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "ModernOS $tag" --notes-file "$notes"
          fi
          gh workflow run ISO --ref "${{ github.event.repository.default_branch }}" -f "tag=$tag"
