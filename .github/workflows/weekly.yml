# Things that break without a commit: a manifest package renamed or
# dropped in the Arch repos or the AUR. Opens one issue, then comments
# on it while the problem lasts.
name: Weekly

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  manifests:
    if: github.repository == 'Gamesearch56/modern_os'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Pacman with multilib
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >>/etc/pacman.conf
          pacman -Syu --noconfirm --needed git jq curl github-cli
      - name: Manifest packages exist
        id: check
        run: |
          set +e
          scripts/check-manifests.sh 2>&1 | tee /tmp/manifests.txt
          echo "rc=${PIPESTATUS[0]}" >>"$GITHUB_OUTPUT"
        shell: bash
      - name: Report
        if: steps.check.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          title="Weekly check: manifest packages missing"
          body="$(printf '%s\n\n```\n%s\n```\n' \
            "scripts/check-manifests.sh failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." \
            "$(grep -E 'missing|warning|ERROR' /tmp/manifests.txt || cat /tmp/manifests.txt)")"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number -q '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          exit 1
