name: Feature request
description: A change or addition to the desktop
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: What do you want
      description: The problem this would solve, not only the implementation.
    validations:
      required: true
  - type: dropdown
    id: paid
    attributes:
      label: Would you fund this feature?
      description: Paid requests are arranged through Ko-fi (https://ko-fi.com/gamesearch56). Free requests are welcome too.
      options:
        - "No, just a suggestion"
        - "Yes, I'd like to fund it"
  - type: textarea
    id: notes
    attributes:
      label: Extra context
      description: Mockups, related docs, or settings keys if you know them.
