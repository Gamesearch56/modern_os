name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected vs what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Latest release tag (vX.Y.Z on the Releases page), ISO name, or git commit.
      placeholder: vX.Y.Z
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: doctor.sh, quickshell.log, or journalctl -t modern-install as relevant.
