# Fallback roles if colors.conf is missing. globinclude is a no-op when
# the file is absent; a hard include would abort kitty with no window.
background #141218
foreground #E6E0E9
cursor #D0BCFF
selection_background #4A4458
selection_foreground #E8DEF8
globinclude colors.conf

font_family JetBrainsMono Nerd Font
font_size 11
linux_display_server wayland
shell_integration enabled
allow_remote_control yes
