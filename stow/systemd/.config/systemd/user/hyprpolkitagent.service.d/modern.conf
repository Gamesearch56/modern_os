# hyprpolkitagent is hyprtoolkit; chrome lives in hyprtoolkit.conf.
# Keep qt6ct/wayland env so a start that misses Hyprland's
# import-environment does not fall back to a light Qt theme. See docs/THEMING.md.
[Service]
Environment=QT_QPA_PLATFORM=wayland
Environment=QT_QPA_PLATFORMTHEME=qt6ct
Environment=QT_QUICK_CONTROLS_STYLE=org.hyprland.style
Environment=QT_WAYLAND_DISABLE_WINDOWDECORATION=1
