# hyprpolkitagent is QML (org.hyprland.style) and reads the qt6ct
# SystemPalette. Without these, a start that misses Hyprland's
# import-environment lands on a light Fusion fallback. See docs/THEMING.md.
[Service]
Environment=QT_QPA_PLATFORM=wayland
Environment=QT_QPA_PLATFORMTHEME=qt6ct
Environment=QT_QUICK_CONTROLS_STYLE=org.hyprland.style
Environment=QT_WAYLAND_DISABLE_WINDOWDECORATION=1
