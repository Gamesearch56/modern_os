# Silent output the shell parks on while multipoint headphones are with
# another device. Sound that starts here plays into it until the headset
# switches over, instead of out of the speakers. The shell hides it from
# every device list; a low session priority keeps WirePlumber from ever
# choosing it on its own.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "modern.headset-hold"
      node.description = "Headset hold"
      media.class = Audio/Sink
      audio.position = [ FL FR ]
      node.virtual = true
      monitor.channel-volumes = true
      priority.session = 1
      priority.driver = 1
    }
  }
]
