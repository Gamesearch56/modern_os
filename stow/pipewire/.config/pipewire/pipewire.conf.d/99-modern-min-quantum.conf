# Floor for the whole graph: about 5 ms at 48 kHz. PipeWire's own 32 is
# tighter than a busy compositor reliably serves. The large headroom
# that Steam's CEF store plus a browser video needed is applied to those
# clients alone in pipewire-pulse.conf.d/99-modern-browser-latency.conf,
# so games and calls are not held at 21 ms for it.
context.properties = {
    default.clock.min-quantum = 256
}
