# Chromium, CEF and Firefox underrun at small quanta while Steam's store
# scrolls next to a playing video. A 1024-sample floor (about 21 ms) for
# them only; video players compensate, and nothing interactive waits on it.
pulse.rules = [
    {
        matches = [
            { application.process.binary = "~^(steamwebhelper|chrome|chromium|vivaldi-bin|brave|electron[0-9]*|firefox|librewolf|zen-bin)$" }
        ]
        actions = {
            update-props = {
                pulse.min.quantum = 1024/48000
            }
        }
    }
]
