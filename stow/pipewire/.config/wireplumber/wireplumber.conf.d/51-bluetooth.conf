# Multipoint headsets switch the way a phone does: the active stream
# follows AVRCP playback, and an idle A2DP transport is suspended so the
# other device can play. Holding the transport (timeout 0) pins the
# headset here as soon as any app opens an audio stream. The shell
# connects the headset only after real sound, so the sink is already
# fed and this timeout does not eat the start of playback.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.dummy-avrcp-player = true
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_hf ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
