# Multipoint headsets keep two hosts. Paging from every host, an idle
# AVRCP player, or the headset profile makes the buds drop one side and
# forget which bond is saved. The user connects; BlueZ Connect brings
# A2DP up. An idle transport suspends so the other host can play.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.dummy-avrcp-player = false
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
