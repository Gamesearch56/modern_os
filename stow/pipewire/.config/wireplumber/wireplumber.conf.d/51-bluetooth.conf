# Bluetooth headsets: do not suspend idle A2DP nodes. The default 5s
# suspend is the gap between the buds connecting and sound actually
# starting. HFP still autoswitches when an app records (calls).

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
}

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_hf ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
