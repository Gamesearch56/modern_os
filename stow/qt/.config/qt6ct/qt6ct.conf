# qt6ct. color_scheme_path is relative-to-home via ~/ so it never
# hardcodes a username the way the audited qt6ct.conf did.
[Appearance]
color_scheme_path=~/.config/qt6ct/colors/modern.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=xdgdesktopportal
style=Fusion

[Fonts]
fixed=@ByteArray(JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0)
general=@ByteArray(Inter,11,-1,5,50,0,0,0,0,0)

[Interface]
stylesheets=~/.config/qt6ct/qss/modern.qss
