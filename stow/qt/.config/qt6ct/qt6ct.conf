# qt6ct. theme-apply.sh rewrites color_scheme_path to an absolute
# $HOME path — qt6ct does not expand ~. Do not load modern.qss:
# QStyleSheetStyle makes Fusion ignore the custom Active palette
# (white icon grid on hover/focus, dark sidebar text).
[Appearance]
color_scheme_path=/home/devuser/.config/qt6ct/colors/modern.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=xdgdesktopportal
style=qt6ct-style

[Fonts]
fixed=@ByteArray(JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0)
general=@ByteArray(Inter,11,-1,5,50,0,0,0,0,0)

[Interface]
stylesheets=
