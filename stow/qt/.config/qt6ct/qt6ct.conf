# qt6ct. Do not commit color_scheme_path — qt6ct needs an absolute
# path and does not expand ~. theme-apply.sh writes
# $HOME/.config/qt6ct/colors/modern.conf after [Appearance].
# Do not load modern.qss: QStyleSheetStyle makes Fusion ignore the
# custom Active palette (white icon grid on hover/focus, dark sidebar).
[Appearance]
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=xdgdesktopportal
style=qt6ct-style

[Fonts]
fixed="JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0"
general="Inter,11,-1,5,50,0,0,0,0,0"

[Interface]
stylesheets=
