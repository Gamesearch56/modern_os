# qt6ct. theme-apply.sh rewrites color_scheme_path and stylesheets to
# absolute $HOME paths — qt6ct does not expand ~.
[Appearance]
color_scheme_path=/home/devuser/.config/qt6ct/colors/modern.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=xdgdesktopportal
style=Fusion

[Fonts]
fixed=@ByteArray(JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0)
general=@ByteArray(Inter,11,-1,5,50,0,0,0,0,0)

[Interface]
stylesheets=/home/devuser/.config/qt6ct/qss/modern.qss
