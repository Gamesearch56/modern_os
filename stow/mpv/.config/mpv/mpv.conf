# Stow config for the current external video player only.
# install/manifests/default-apps.json videoPlayer.stow names this package.
# Delete this tree with that entry.
# osc=no is required so mpv_thumbnail_script_client_osc.lua can own the OSC.
osc=no

# Auto Loop Videos
loop-file=inf

# Start videos muted by default
mute=yes

# Screenshots
screenshot-directory=~/Pictures/Screenshots

# Use the new, modern rendering engine
vo=gpu-next

# Use Vulkan instead of OpenGL
gpu-api=vulkan

# Hardware-Acceleration
hwdec=auto-safe

# HDR fix
target-colorspace-hint=yes

video-output-levels=full
dither-depth=auto
