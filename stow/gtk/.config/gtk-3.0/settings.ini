# Prefer dark from the MD3 pipeline. gtk.css itself is generated by
# matugen into this same directory (gitignored). Font family is Inter
# by default; theme-apply.sh (--chrome-only) writes gtk-font-name,
# later rather than baking a user path here.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-font-name=Inter 11
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
